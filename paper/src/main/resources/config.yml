# Katharsis companion configuration.
#
# Almost nothing lives here on purpose: the player's language, the selector's
# title, the language names and the confirmation message are all translated by
# the proxy plugin, in its lang/ directory. Edit them there and every server
# picks the change up at once.

# How long to wait for the proxy to answer before telling the player it is
# unreachable, in seconds.
request-timeout-seconds: 5

# The only strings this plugin owns, because they are what it says when the
# proxy did not answer and there is no language to say it in.
# Formatting uses MiniMessage: https://docs.advntr.dev/minimessage/format.html
messages:
  proxy-unreachable: "<red>Could not reach the proxy. Please try again in a moment."
  players-only: "<red>Only players can use this command."
