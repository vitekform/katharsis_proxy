# Build pipeline for the Katharsis plugins.
#
#   Proxy job      - compiles the Velocity plugin, runs its unit tests, shades
#                    the jar, then boots it on a real Velocity proxy.
#   Companion job  - builds the Paper companion for the 1.21.x line on JDK 21,
#                    runs its unit tests, then recompiles it against every
#                    supported Paper API.
#   Companion26    - builds the same sources for the 26.x line, which needs
#                    JDK 25 because every 26.x API jar is a Java 25 artifact.
#   Publish stage  - keeps both jars as build artifacts, master only.
#
# The two jobs are independent: the plugins share a wire protocol, not code, and
# each side pins the other's exact bytes in its own tests.

name: $(Date:yyyyMMdd)$(Rev:.r)

trigger:
  batch: true
  branches:
    include:
      - master

pr:
  branches:
    include:
      - master

variables:
  # Kept off the default ~/.m2 so the Cache task can restore it.
  MAVEN_CACHE_FOLDER: $(Pipeline.Workspace)/.m2/repository
  # Lives outside target/ so `mvn clean` cannot delete the cached download.
  VELOCITY_CACHE_FOLDER: $(Pipeline.Workspace)/.velocity
  MAVEN_OPTS: '-Dmaven.repo.local=$(MAVEN_CACHE_FOLDER) -Xmx1024m'
  # The proxy and the companion's 1.21.x variant build on the agent's
  # preinstalled JDK.
  JDK_VERSION: '21'
  # The companion's 26.x variant cannot: every 26.x Paper API jar is compiled to
  # Java 25 bytecode, which an older javac cannot read at all. Hosted images do
  # not preinstall it, so that job fetches one.
  COMPANION_26_JDK_VERSION: '25'
  JDK_INSTALL_DIR: $(Pipeline.Workspace)/.jdk

stages:
  - stage: Build
    displayName: Build and test
    jobs:
      - job: Proxy
        displayName: Velocity plugin
        pool:
          vmImage: ubuntu-latest
        # The integration test downloads Velocity and boots a JVM, so allow
        # noticeably more than a plain compile would need.
        timeoutInMinutes: 30
        steps:
          - checkout: self
            fetchDepth: 1
            displayName: Checkout

          - task: JavaToolInstaller@0
            displayName: Use JDK $(JDK_VERSION)
            inputs:
              versionSpec: $(JDK_VERSION)
              jdkArchitectureOption: x64
              jdkSourceOption: PreInstalled

          - task: Cache@2
            displayName: Restore Maven repository
            inputs:
              key: 'maven | "$(Agent.OS)" | pom.xml'
              restoreKeys: |
                maven | "$(Agent.OS)"
                maven
              path: $(MAVEN_CACHE_FOLDER)

          - task: Cache@2
            displayName: Restore Velocity download
            inputs:
              # Keyed on the pom so a version bump fetches the new jar. The test
              # verifies the SHA-256 either way, so a stale entry cannot be used.
              key: 'velocity | "$(Agent.OS)" | pom.xml'
              path: $(VELOCITY_CACHE_FOLDER)

          - script: |
              set -euo pipefail
              mvn -B -ntp \
                -Dvelocity.cache.dir=$(VELOCITY_CACHE_FOLDER) \
                clean verify
            displayName: Build, unit test, shade and boot on Velocity

          - task: PublishTestResults@2
            displayName: Publish unit test results
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: '**/surefire-reports/TEST-*.xml'
              testRunTitle: 'Proxy unit tests (JDK $(JDK_VERSION))'
              failTaskOnFailedTests: true

          - task: PublishTestResults@2
            displayName: Publish integration test results
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: '**/failsafe-reports/TEST-*.xml'
              testRunTitle: 'Proxy integration tests (real Velocity server)'
              failTaskOnFailedTests: true

          - task: PublishCodeCoverageResults@2
            displayName: Publish code coverage
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: '$(Build.SourcesDirectory)/target/site/jacoco/jacoco.xml'
              pathToSources: '$(Build.SourcesDirectory)/src/main/java'

          - task: CopyFiles@2
            displayName: Stage the plugin jar
            inputs:
              sourceFolder: '$(Build.SourcesDirectory)/target'
              # original-*.jar is the pre-shade jar and is not shipped.
              contents: |
                katharsis_proxy-*.jar
                !original-*.jar
              targetFolder: '$(Build.ArtifactStagingDirectory)'

          - publish: $(Build.ArtifactStagingDirectory)
            artifact: proxy-plugin
            displayName: Publish the proxy jar

      - job: Companion
        displayName: Paper companion (1.21.x)
        pool:
          vmImage: ubuntu-latest
        # The compatibility check resolves a dependency tree per supported Paper
        # version, which is slow the first time the Maven cache is cold.
        timeoutInMinutes: 30
        steps:
          - checkout: self
            fetchDepth: 1
            displayName: Checkout

          - task: JavaToolInstaller@0
            displayName: Use JDK $(JDK_VERSION)
            inputs:
              versionSpec: $(JDK_VERSION)
              jdkArchitectureOption: x64
              jdkSourceOption: PreInstalled

          - task: Cache@2
            displayName: Restore Maven repository
            inputs:
              key: 'maven | "$(Agent.OS)" | paper/pom.xml'
              restoreKeys: |
                maven | "$(Agent.OS)"
                maven
              path: $(MAVEN_CACHE_FOLDER)

          - script: |
              set -euo pipefail
              mvn -B -ntp -f paper/pom.xml clean verify
            displayName: Build and unit test the companion

          - script: |
              set -euo pipefail
              ./paper/compat-check.sh
            displayName: Compile against every supported Paper API

          - task: PublishTestResults@2
            displayName: Publish companion test results
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: 'paper/target/surefire-reports/TEST-*.xml'
              testRunTitle: 'Companion 1.21.x unit tests (JDK $(JDK_VERSION))'
              failTaskOnFailedTests: true

          - task: PublishCodeCoverageResults@2
            displayName: Publish companion code coverage
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: '$(Build.SourcesDirectory)/paper/target/site/jacoco/jacoco.xml'
              pathToSources: '$(Build.SourcesDirectory)/paper/src/main/java'

          - task: CopyFiles@2
            displayName: Stage the companion jar
            inputs:
              sourceFolder: '$(Build.SourcesDirectory)/paper/target'
              contents: |
                katharsis_paper-*.jar
                !katharsis_paper-*-mc26.jar
              targetFolder: '$(Build.ArtifactStagingDirectory)'

          - publish: $(Build.ArtifactStagingDirectory)
            artifact: companion-plugin
            displayName: Publish the companion jar

      - job: Companion26
        displayName: Paper companion (26.x)
        pool:
          vmImage: ubuntu-latest
        timeoutInMinutes: 30
        steps:
          - checkout: self
            fetchDepth: 1
            displayName: Checkout

          - task: Cache@2
            displayName: Restore JDK $(COMPANION_26_JDK_VERSION)
            inputs:
              key: 'jdk | "$(Agent.OS)" | "$(COMPANION_26_JDK_VERSION)"'
              path: $(JDK_INSTALL_DIR)

          - script: |
              set -euo pipefail

              # 1. A cached copy from an earlier run.
              if [ -x "$(JDK_INSTALL_DIR)/bin/javac" ]; then
                echo "Reusing the cached JDK"
                JAVA_DIR="$(JDK_INSTALL_DIR)"

              # 2. One preinstalled on the image, if it ever ships this version.
              elif [ -n "${JAVA_HOME_$(COMPANION_26_JDK_VERSION)_X64:-}" ]; then
                echo "Using the image's preinstalled JDK"
                JAVA_DIR="${JAVA_HOME_$(COMPANION_26_JDK_VERSION)_X64}"

              # 3. Otherwise fetch it. Extract to a scratch directory and only
              #    move it into place once it actually runs, so an interrupted
              #    download cannot leave a half-unpacked JDK for the cache.
              else
                echo "Fetching JDK $(COMPANION_26_JDK_VERSION) from Adoptium"
                STAGING="$(Agent.TempDirectory)/jdk-staging"
                rm -rf "$STAGING" && mkdir -p "$STAGING"
                curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors --connect-timeout 30 \
                  "https://api.adoptium.net/v3/binary/latest/$(COMPANION_26_JDK_VERSION)/ga/linux/x64/jdk/hotspot/normal/eclipse" \
                  | tar -xz -C "$STAGING" --strip-components=1
                "$STAGING/bin/javac" -version
                # No dirname here: $() is Azure's own macro syntax, and the
                # parent is $(Pipeline.Workspace), which always exists.
                rm -rf "$(JDK_INSTALL_DIR)"
                mv "$STAGING" "$(JDK_INSTALL_DIR)"
                JAVA_DIR="$(JDK_INSTALL_DIR)"
              fi

              "$JAVA_DIR/bin/javac" -version
              echo "##vso[task.setvariable variable=JAVA_HOME]$JAVA_DIR"
              echo "##vso[task.prependpath]$JAVA_DIR/bin"
            displayName: Install JDK $(COMPANION_26_JDK_VERSION)

          - task: Cache@2
            displayName: Restore Maven repository
            inputs:
              key: 'maven | "$(Agent.OS)" | paper/pom.xml'
              restoreKeys: |
                maven | "$(Agent.OS)"
                maven
              path: $(MAVEN_CACHE_FOLDER)

          - script: |
              set -euo pipefail
              mvn -B -ntp -f paper/pom.xml -P paper-26 clean verify
            displayName: Build and unit test the 26.x variant

          - script: |
              set -euo pipefail
              # This JDK can read both lines' APIs, so --strict here proves the
              # whole range was checked rather than just the half JDK 21 reaches.
              ./paper/compat-check.sh --strict
            displayName: Compile against every supported Paper API (full range)

          - task: PublishTestResults@2
            displayName: Publish 26.x test results
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: 'paper/target/surefire-reports/TEST-*.xml'
              testRunTitle: 'Companion 26.x unit tests (JDK $(COMPANION_26_JDK_VERSION))'
              failTaskOnFailedTests: true

          - task: CopyFiles@2
            displayName: Stage the 26.x companion jar
            inputs:
              sourceFolder: '$(Build.SourcesDirectory)/paper/target'
              contents: 'katharsis_paper-*-mc26.jar'
              targetFolder: '$(Build.ArtifactStagingDirectory)'

          - publish: $(Build.ArtifactStagingDirectory)
            artifact: companion-plugin-26
            displayName: Publish the 26.x companion jar

  - stage: Publish
    displayName: Publish artifact
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
    jobs:
      - job: Artifact
        displayName: Retain both jars
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: none

          - download: current
            artifact: proxy-plugin
            displayName: Download the proxy jar

          - download: current
            artifact: companion-plugin
            displayName: Download the 1.21.x companion jar

          - download: current
            artifact: companion-plugin-26
            displayName: Download the 26.x companion jar

          - task: PublishBuildArtifacts@1
            displayName: Retain the proxy jar
            inputs:
              pathToPublish: '$(Pipeline.Workspace)/proxy-plugin'
              artifactName: katharsis-proxy

          - task: PublishBuildArtifacts@1
            displayName: Retain the 1.21.x companion jar
            inputs:
              pathToPublish: '$(Pipeline.Workspace)/companion-plugin'
              artifactName: katharsis-companion

          - task: PublishBuildArtifacts@1
            displayName: Retain the 26.x companion jar
            inputs:
              pathToPublish: '$(Pipeline.Workspace)/companion-plugin-26'
              artifactName: katharsis-companion-26
