# Katharsis proxy configuration.
#
# Keys left out of this file fall back to their built-in defaults, so it is
# safe to delete anything you do not want to override.

database:
  # Where player data is stored.
  #   h2         - embedded file database, no setup required (default)
  #   postgresql - external PostgreSQL server, configured below
  type: h2

  # Used when type is h2.
  h2:
    # Database file name, relative to this plugin's data directory.
    # H2 appends its own .mv.db suffix.
    file: katharsis

  # Used when type is postgresql. Ignored while type is h2.
  postgresql:
    # Hostname or IP address of the PostgreSQL server.
    host: localhost
    # Port the PostgreSQL server listens on.
    port: 5432
    # Name of the database to use. It must already exist.
    database: katharsis
    # User to authenticate as.
    username: katharsis
    # Password for the user above.
    password: ''
    # SSL mode passed to the JDBC driver.
    # One of: disable, allow, prefer, require, verify-ca, verify-full.
    ssl-mode: disable

  # Connection pool, used by both backends.
  pool:
    # Maximum number of connections kept in the pool.
    maximum-pool-size: 10
    # Minimum number of idle connections kept in the pool.
    minimum-idle: 2
    # How long to wait for a connection from the pool, in milliseconds.
    connection-timeout-ms: 10000
    # How long an idle connection may sit unused in the pool, in milliseconds.
    idle-timeout-ms: 600000
    # Maximum lifetime of a connection, in milliseconds.
    # Keep this below any idle timeout enforced by PostgreSQL or your firewall.
    max-lifetime-ms: 1800000

# Server list ping. A "banner" MOTD is a chat component whose glyphs only line
# up into a picture on Minecraft 1.21.9-1.21.11; every other client is served
# the fallback below instead of a row of broken characters.
motd:
  # Take over the server list ping. While this is false the proxy answers from
  # the motd in velocity.toml and nothing else in this section applies.
  enabled: false

  # Banners are read from this plugin's data directory as chat component JSON,
  # named motd.json, motd2.json, motd3.json and so on. This is how many to look
  # for; files that are missing or malformed are logged and skipped.
  count: 1

  # How to choose when more than one is loaded.
  #   random  - a different one per ping (default)
  #   rolling - one at a time, so everyone pinging together sees the same one
  mode: random

  # How long each banner is served in rolling mode.
  rolling-interval-seconds: 60

  # Protocol range that renders a banner correctly.
  # 773 is 1.21.9 and 774 is 1.21.11.
  min-protocol: 773
  max-protocol: 774

  # What clients outside that range are shown.
  #   config - the fallback-motd below (default)
  #   proxy  - nothing, so the motd from velocity.toml shows through
  fallback: config
  fallback-motd: "&4This server's MOTD only renders on Minecraft 1.21.9-1.21.11."

  # Replace the version name, which the client shows in place of the ping bars
  # when it cannot join. Uses & colour codes.
  override-version-message: false
  custom-version-message: "&cMaintenance"

  # Advertise a protocol no client shares, so the version line always reads as
  # out of date. Only the number below is sent; it is never used to reject anyone.
  always-out-of-date: false
  out-of-date-protocol: 773

  # Hide the player count entirely. Takes precedence over the fake count below.
  hide-player-count: false

  # Advertise a made-up count instead of the real one. The online figure is
  # max-players * fake-player-percentage / 100.
  fake-player-count: false
  fake-player-percentage: 10
  max-players: 67

  # Build banners from images. Each motd.png, motd2.png, ... in this plugin's
  # data directory is cut into 8x8 tiles, every tile is uploaded to MineSkin as
  # the face of a player skin, and the matching motd.json, motd2.json, ... is
  # written from the resulting heads. 64x16 images fit the server list exactly:
  # two lines of eight heads.
  #
  # This runs in the background at startup, only for images newer than their
  # JSON, so a hand-written motd.json with no image is never touched. Uploads
  # are slow (about six seconds each), but every tile is remembered in
  # motd-skin-cache.json and never uploaded twice. A skin_cache.json from the
  # standalone Python generator uses the same format and can be renamed to
  # motd-skin-cache.json to reuse its uploads.
  #
  # Images are sent to api.mineskin.org, a third-party service, and are handled
  # under its terms.
  generator:
    enabled: true
    # Optional. MineSkin expects automated clients to authenticate and gives
    # them higher limits. Create a key in your MineSkin account.
    mineskin-api-key: ''
    # MineSkin's v1 upload endpoint, as used by the standalone generator.
    mineskin-url: https://api.mineskin.org/generate/upload
    # Pause between uploads, in milliseconds, to stay under the rate limit.
    upload-delay-ms: 6200
    # Pause before retrying a rate-limited or failed upload, in milliseconds,
    # unless MineSkin says how long to wait.
    retry-delay-ms: 10000
    # Attempts per tile before that image is given up on. Tiles that did upload
    # stay cached, so the next start carries on where this one stopped.
    max-attempts: 5

# Discord bot, running on its own thread next to the proxy.
discord:
  # Log the bot in at startup.
  enabled: false
  # Bot token from the Discord developer portal (Applications > Bot > Reset
  # Token). Anyone holding it controls the bot, so keep this file private.
  token: ''

  # Discord server (guild) id the bot works in. /link is registered there, and
  # the linked role below is granted there. Copy it with Developer Mode on by
  # right-clicking the server icon > Copy Server ID.
  guild-id: 0

  # Role given to members once they link their Minecraft account with /link.
  # The bot needs the Manage Roles permission, and its own highest role must be
  # above this one. 0 grants no role.
  linked-role-id: 0

  # Discord channel each server's chat is posted to, as **player:** message.
  # Keys are server ids: the server-id set in the companion plugin's config.yml,
  # or the server's name in velocity.toml where that is left empty. Values are
  # channel ids; turn on Developer Mode in Discord's settings, then right-click
  # a channel and Copy Channel ID. The bot needs permission to send messages
  # there. Chat from servers not listed here stays out of Discord.
  #
  # chat-channels:
  #   lobby: 123456789012345678
  #   lifesteal: 234567890123456789
  chat-channels: {}

  # Deliver what members write in those chat channels to the players on the
  # servers mapped to them, shown by their linked Minecraft name. Several
  # servers may share a channel; all of them get its messages. Messages from
  # bots and webhooks are ignored.
  #
  # The bot needs the Message Content intent to read messages: switch it on in
  # the developer portal (Applications > Bot > Privileged Gateway Intents).
  # While this is true and the intent is off there, Discord refuses the login
  # and the whole bot, /link included, stays offline.
  relay-to-minecraft: true

# Chat moderation. Every message a backend reports passes these filters before
# it is relayed to Discord and written to the chat log; nothing that is held
# back reaches either.
#
# The proxy is told about a message only after the backend has already shown it
# in game, so holding one back here does not un-say it to the players who were
# standing there. What it does is keep it out of Discord and out of the log,
# record it as flagged, tell the staff channel, and tell its author.
#
# Messages are checked in order of what they cost: the words and patterns below
# run in memory, and only what they let through is sent to OpenAI.
moderation:
  # While this is false chat is relayed and logged exactly as before.
  enabled: false

  # Literal terms. Before matching, a message is folded down to bare letters:
  # accents and look-alikes are mapped onto the letter they imitate, invisible
  # characters are dropped, and spacing and punctuation are removed. A term is
  # also matched stretched out, so one entry catches "racist", "r a c i s t",
  # "r.a.c.i.s.t", "r@c1st", "ｒａｃｉｓｔ" and "raaaciiist" alike. Case does not
  # matter. Leave this empty and only the patterns and the model run.
  #
  # words:
  #   - racist
  words: []

  # Regular expressions, used exactly as written, matched both against the
  # folded form and against the message as it was typed. Use these for what a
  # word list cannot say, such as an address or an invite link. An expression
  # that does not compile is logged and skipped.
  #
  # patterns:
  #   - '(?:https?://)?discord\.gg/\w+'
  patterns: []

  # Innocent words that contain one of the terms above. Because the folded form
  # has no spaces left, a short term is a substring of longer words: "cunt" is
  # inside "Scunthorpe" and "ass" inside "assassin". A match that falls inside
  # one of these is not treated as a match. Only applies to words, not patterns.
  #
  # allow:
  #   - scunthorpe
  #   - assassin
  allow: []

  # Tell the author their message was not sent. They are never told which rule
  # caught it, or shown what they wrote back: that only helps them find a
  # spelling that gets through.
  warn-player: true

  # Discord channel held-back messages are reported in, with the player, the
  # server, what caught it and the message itself. Turn on Developer Mode in
  # Discord's settings, then right-click a channel and Copy Channel ID. 0
  # reports none, and messages are only logged and stored.
  #
  # Messages held back because nothing could check them are not reported here:
  # they say nothing about the player, and an outage would post one for every
  # message on the network.
  staff-channel-id: 0

  # OpenAI's moderation model, asked about what the rules above let through.
  # Text is sent to api.openai.com, a third-party service, and is handled under
  # its terms. The message is sent as it was written, since the model reads
  # obfuscation better than a word list does.
  openai:
    enabled: false
    # Key from platform.openai.com. Anyone holding it can spend against your
    # account, so keep this file private.
    api-key: ''
    model: omni-moderation-latest
    url: https://api.openai.com/v1/moderations

    # Longest to wait for an answer, in milliseconds. The message is not
    # relayed to Discord or stored until the answer comes, so a large value
    # delays those; it does not delay what players already saw in game.
    #
    # Generous on purpose. Real calls take well over a second, and a timeout is
    # treated as a fault: the message is held back as "unavailable" and its
    # author is asked to try again. Waiting is nearly always better than that.
    timeout-ms: 30000

    # The quota on your key. The proxy counts against these itself and stops
    # sending before OpenAI starts refusing, so the day's requests are spent on
    # messages rather than on errors. 0 does not count that limit at all.
    requests-per-minute: 500
    tokens-per-minute: 10000
    requests-per-day: 10000

    # Categories acted on, as the model names them: harassment,
    # harassment/threatening, hate, hate/threatening, self-harm,
    # self-harm/intent, self-harm/instructions, sexual, sexual/minors,
    # violence, violence/graphic, illicit, illicit/violent.
    # Empty acts on every category the model flags.
    #
    # categories:
    #   - hate
    #   - hate/threatening
    #   - harassment/threatening
    categories: []

    # Hold a message back when a category scores at least this, even where the
    # model did not flag it itself. Lower catches more and is wrong more often.
    # 0 leaves the decision entirely to the model.
    score-threshold: 0.0

    # When the model cannot answer, two things are told apart on purpose.
    # Running out of quota, here or at OpenAI, lets messages through unchecked:
    # the limit is reached in ordinary use and chat must not stop working every
    # evening. Anything else - a timeout, a refused key, an unreadable answer -
    # holds them back, because that is a fault to fix rather than a state to
    # live in. Held-back messages of that kind are stored as "unavailable" and
    # are not a finding against the player.

# Logging in. Players without a Mojang account wait in an empty void, where
# only /login and /register work, until they log in; nothing else is reachable
# before that, not even the first server. Passwords are hashed with Argon2id.
#
# The void is provided by LimboAPI (https://github.com/Elytrium/LimboAPI),
# which must be installed on this proxy. Without it, and whenever the database
# is down, players without a Mojang account are refused at the door.
auth:
  # While this is false anyone can join under any name, which on an
  # offline-mode proxy means anyone can play as anyone.
  enabled: true

  # Kick a player who has not logged in within this many seconds.
  login-timeout-seconds: 60

  # Kick a player after this many wrong passwords in one connection.
  max-attempts: 3

  # Length limits for new passwords, in characters.
  min-password-length: 8
  max-password-length: 64

  # Names held by a Mojang account are sent through Mojang's own login and
  # never asked for a password; the name is claimed for that account the first
  # time. Someone using such a name without owning the account fails Mojang's
  # login and cannot join under it. A name already registered with a password
  # stays a password account.
  premium-skip: true

  # Where a name is looked up to tell whether a Mojang account holds it, and
  # how long to wait, in milliseconds. If Mojang cannot be asked, the player is
  # treated as having no Mojang account.
  mojang-url: https://api.mojang.com/users/profiles/minecraft/
  mojang-timeout-ms: 5000

  # Cost of hashing each password. The defaults are OWASP's recommended
  # minimum for Argon2id. Raising them makes stolen hashes harder to crack and
  # every login slower; existing passwords are rehashed with the new settings
  # the next time their owner logs in.
  argon2:
    # Memory per hash, in KiB.
    memory-kib: 19456
    iterations: 2
    parallelism: 1

punishments:
  # Bans, mutes, kicks and warnings, given with /ban, /tempban, /banip,
  # /unban, /mute, /tempmute, /muteip, /unmute, /kick, /history and /check. Every command needs its permission,
  # katharsis.punish.<command>, which nobody has until it is granted.
  # Punishing on the whole network also needs katharsis.punish.global, seeing
  # addresses katharsis.punish.seeip; staff with katharsis.punish.notify are
  # told about every punishment, and katharsis.punish.exempt cannot be punished.
  enabled: true

  # Servers that are punished together, named after velocity.toml. A
  # punishment on a group applies on every server in it, as the group stands
  # when it is checked: adding a server here extends the bans already issued
  # on the group. "global" is taken, and cannot be a group name.
  #
  # server-groups:
  #   survival:
  #     - lifesteal
  #     - lifesteal2
  server-groups: {}

  # Where a punishment applies when the command does not say (-g for the
  # whole network, -s NAME for a server or group):
  #   current-server - the server the staff member is on
  #   global         - the whole network
  default-scope: current-server

  # With current-server, a server that belongs to a group punishes on the
  # whole group.
  default-scope-uses-group: true

  # Where punishments from the console and Discord apply when none is named:
  # global, or a server or group.
  console-default-scope: global

  # /ban and /tempban also ban the address the player last joined from, so a
  # fresh account on the same connection is kept out too. -a bans only the
  # account; /banip or -i bans only the address.
  ban-ip-by-default: true

  # Stored as the reason when a staff member gives none.
  default-reason: "No reason given"

  # Shown at the bottom of the ban screen, e.g. a Discord invite or a form.
  # Leave empty to show nothing.
  appeal-url: ""

  # What to do with a player joining while bans cannot be checked, e.g. the
  # database is down: true turns them away, false lets them in and logs it.
  fail-closed: false

  # Addresses many players share through no fault of their own, such as a
  # reverse proxy's in front of this one when it does not pass on real
  # addresses. They are never banned. If every player seems to join from one
  # address, set up proxy-protocol forwarding instead.
  trusted-proxy-ips: []

  # Commands a muted player cannot use, since they would only talk through
  # them instead. Chat and these are blocked on servers running the companion
  # plugin; on the proxy only its own commands can be blocked. Namespaced forms
  # such as minecraft:msg are blocked too.
  muted-commands:
    - msg
    - tell
    - w
    - whisper
    - m
    - t
    - pm
    - dm
    - r
    - reply
    - me
    - say
    - mail

# Language assigned to a player the first time they join.
# At most 5 characters, e.g. en_US.
default-language: en_US

# Writes debug.log next to this file: one line per OpenAI moderation call, with
# the model, the URL, the message, the answer, the categories and how long it
# took. That is the detail needed to tell a refused key from a slow one from a
# message the model simply did not object to, and none of it survives in the
# proxy console.
#
# The API key is never written. The chat text is, so the file is as private as
# the messages in it. It is rotated to debug.log.1 past 5 MiB, so it cannot
# grow without bound; delete either file at any time, including while the proxy
# is running.
debug-log: true
