# Keeps the Katharsis mod up to date from the release system, rsys.ganamaga.me.
# A newer jar for this Minecraft version is downloaded to katharsis/updates/ in
# the server folder and moved into mods/ once the server stops, so the next
# start runs it. Jars built by hand rather than by CI are told about updates
# but never replaced on their own.

enabled=true

# Which builds count as updates:
#   auto     - whatever this jar is: a dev build follows dev builds, a release
#              follows releases (default)
#   release  - tagged releases only
#   dev      - every build of master too
channel=auto

# Download a newer jar as soon as one is found. Off, updates are only logged.
auto-download=true

# Hours between checks; 0 checks only at startup.
check-interval-hours=6

# The project's public root on the release system. Leave empty for
# https://rsys.ganamaga.me/katharsis/public.
url=
