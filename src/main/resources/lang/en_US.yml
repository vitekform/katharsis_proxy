# English (en_US) messages for the Katharsis proxy.
#
# Formatting uses MiniMessage: https://docs.advntr.dev/minimessage/format.html
# Placeholders are written like <server> and are listed per message below.
# To add a language, copy this file to lang/<code>.yml and translate the values.
# The file name is the language code, and it must be at most 5 characters.

prefix: "<dark_gray>[<gold>Katharsis</gold>]</dark_gray> "

players-only: "<red>Only players can use this command.</red>"

# <server>
connecting: "<gray>Sending you to <gold><server></gold>...</gray>"
# <server>
already-connected: "<red>You are already on <gold><server></gold>.</red>"
# <server>
unknown-server: "<red>The server <gold><server></gold> is not configured on this proxy.</red>"
# <server>
connection-failed: "<red>Could not connect you to <gold><server></gold>. Please try again later.</red>"

# <time>
on-cooldown: "<red>Please wait <gold><time></gold> before using this command again.</red>"
# <minutes> <seconds>
duration-minutes-seconds: "<minutes>m <seconds>s"
# <seconds>
duration-seconds: "<seconds>s"

# <language>
language-changed: "<green>Your language is now <gold><language></gold>.</green>"

# Shown in the companion plugin's language selector.
# Each language file names itself, so every entry reads natively.
language-name: "English (US)"
menu-title: "<dark_gray>Select your language"
menu-select-hint: "<gray>Click to use this language."
menu-current-hint: "<green>You are using this language."

# Account linking, in game.
link-usage: "<red>Usage: <gold>/link CODE</gold>. Run <gold>/link</gold> on our Discord server to get a code.</red>"
# <discord>
link-success: "<green>Your account is now linked to the Discord account <gold><discord></gold>.</green>"
link-invalid-code: "<red>That link code is invalid, expired or already used. Run <gold>/link</gold> on Discord for a new one.</red>"
# <discord>
link-already-linked: "<red>Your account is already linked to the Discord account <gold><discord></gold>.</red>"
link-discord-taken: "<red>That Discord account is already linked to another player.</red>"
link-unavailable: "<red>Account linking is unavailable right now. Please try again later.</red>"

# Account linking, on Discord. These are sent to Discord, so they use Discord's
# markdown (**bold**, `code`) rather than MiniMessage colours.
discord-link-description: "Link your Minecraft account to your Discord account"
# <code> <hours>
discord-link-code: "Your link code is **<code>**. Join the Minecraft server and type `/link <code>` within <hours> hours. The code works once."
# <player>
discord-link-already-linked: "Your Discord account is already linked to **<player>**."
discord-link-unavailable: "Account linking is unavailable right now. Please try again later."

# In game, a message written in a Discord chat channel.
# <player> is the author's linked Minecraft name, <message> what they wrote.
discord-chat-message: "<dark_gray>[<blue>Discord</blue>]</dark_gray> <gray><player>:</gray> <white><message></white>"

# The companion plugin's /settings menu.
settings-title: "<dark_gray>Settings"
settings-language: "<gold>Language"
# <language> is the current language's own name.
settings-language-hint: "<gray>Currently <white><language></white>. Click to change."
settings-discord-chat: "<blue>Discord chat"
settings-discord-chat-on: "<green>Shown in game.</green> <gray>Click to hide."
settings-discord-chat-off: "<red>Hidden.</red> <gray>Click to show in game."

# Asked once, on a player's first join, right after they pick a language.
discord-chat-prompt-title: "<dark_gray>Show Discord chat in game?"
discord-chat-prompt-yes: "<green>Yes, show it"
discord-chat-prompt-no: "<red>No, keep it hidden"
discord-chat-shown: "<green>Messages from Discord are now shown in chat. Change this any time with <gold>/settings</gold>.</green>"
discord-chat-hidden: "<gray>Messages from Discord are now hidden. Change this any time with <gold>/settings</gold>.</gray>"

# Chat moderation. Shown to the author of a message the filters held back;
# everyone else simply never sees it.
chat-blocked: "<red>Your message was not sent: it broke the chat rules.</red>"
chat-unchecked: "<gray>Your message could not be checked right now and was not sent. Please try again.</gray>"

# Login. Players without a Mojang account wait in an empty void until they
# log in or register; nothing else works until they do. Kick reasons are
# shown without the prefix.
auth-title: "<gold>Login"
auth-subtitle-login: "<gray>/login PASSWORD"
auth-subtitle-register: "<gray>/register PASSWORD PASSWORD"
auth-prompt-login: "<gray>Welcome back! Log in with <gold>/login PASSWORD</gold>.</gray>"
auth-prompt-register: "<gray>Welcome! Choose a password with <gold>/register PASSWORD PASSWORD</gold>.</gray>"
auth-only-auth-commands: "<red>Only <gold>/login</gold> and <gold>/register</gold> work until you log in.</red>"
auth-login-usage: "<red>Usage: <gold>/login PASSWORD</gold></red>"
auth-register-usage: "<red>Usage: <gold>/register PASSWORD PASSWORD</gold></red>"
auth-not-registered: "<red>This name has no account yet. Use <gold>/register PASSWORD PASSWORD</gold>.</red>"
auth-already-registered: "<red>This name is already registered. Use <gold>/login PASSWORD</gold>.</red>"
# <attempts>
auth-wrong-password: "<red>Wrong password. <gold><attempts></gold> attempt(s) left.</red>"
# <min>
auth-password-too-short: "<red>Your password must be at least <gold><min></gold> characters long.</red>"
# <max>
auth-password-too-long: "<red>Your password must be at most <gold><max></gold> characters long.</red>"
auth-password-mismatch: "<red>The two passwords do not match.</red>"
auth-password-is-username: "<red>Your password cannot be your name.</red>"
auth-busy: "<gray>Still checking your last attempt, please wait.</gray>"
auth-logged-in: "<green>Logged in. Welcome back!</green>"
auth-registered: "<green>Registered and logged in. Remember your password: it cannot be recovered.</green>"
auth-already-logged-in: "<red>You are already logged in.</red>"
auth-kick-attempts: "<red>Too many wrong passwords.</red>"
auth-kick-timeout: "<red>You did not log in in time.</red>"
# <name>
auth-kick-wrong-case: "<red>This account is registered as <gold><name></gold>. Join with exactly that name.</red>"
auth-unavailable: "<red>Logging in is unavailable right now. Please try again later.</red>"

# Punishments. Screens are shown without the prefix; <newline> breaks a line.
duration-days-hours: "<days>d <hours>h"
duration-hours-minutes: "<hours>h <minutes>m"
duration-permanent: "permanent"
punish-type-ban: "ban"
punish-type-mute: "mute"
punish-type-warn: "warning"
punish-type-kick: "kick"
punish-scope-global: "whole network"
punish-scope-server: "<name>"
punish-scope-group: "<name> servers"
punish-ban-screen: "<red><bold>You are banned from this network.</bold></red><newline><newline><gray>Reason: <white><reason></white><newline>Expires in: <white><expires></white><newline>Banned by: <white><issuer></white><newline>Ban ID: <white>#<id></white></gray><appeal>"
punish-appeal-line: "<newline><newline><gray>Appeal at <aqua><url></aqua></gray>"
punish-kick-screen: "<red>You were kicked by <issuer>.</red><newline><gray>Reason: <white><reason></white></gray>"
punish-unavailable-screen: "<red>Your account cannot be checked right now. Please try again later.</red>"
punish-usage: "<red>Usage: <gold><usage></gold></red>"
punish-issued: "<green>Gave <gold><player></gold> a <type> on <scope> <gray>(<duration>)</gray>. <dark_gray>#<id></dark_gray></green>"
punish-kicked: "<green>Kicked <gold><player></gold>. <dark_gray>#<id></dark_gray></green>"
punish-address-skipped: "<gray>No usable address is known for <player>, so only the account was punished.</gray>"
punish-revoked: "<green>Lifted <count> <type>(s) from <gold><player></gold>.</green>"
punish-already-active: "<red><player> already has an active <type> there <dark_gray>#<id></dark_gray>. Add <gold>-f</gold> to replace it.</red>"
punish-target-exempt: "<red><player> cannot be punished.</red>"
punish-target-outranks: "<red><player> ranks too high for you to punish.</red>"
punish-unknown-player: "<red>No player called <gold><player></gold> has played here.</red>"
punish-not-online: "<red><player> is not online.</red>"
punish-no-address: "<red>No usable address is known for <player>.</red>"
punish-nothing-active: "<red><player> has no active <type> to lift.</red>"
punish-unknown-id: "<red>There is no active <type> #<id>.</red>"
punish-invalid-duration: "<red><gold><input></gold> is not a duration. Try <gold>30m</gold>, <gold>7d</gold> or <gold>1mo2w</gold>.</red>"
punish-unknown-scope: "<red>No server or group is called <gold><scope></gold>.</red>"
punish-no-global-permission: "<red>You may not punish on the whole network.</red>"
punish-unavailable: "<red>Punishments are unavailable right now.</red>"
punish-staff-issued: "<dark_gray>[<red>Staff</red>]</dark_gray> <gold><issuer></gold> <gray>gave</gray> <gold><player></gold> <gray>a</gray> <type> <gray>on <scope> (<duration>):</gray> <white><reason></white> <dark_gray>#<id></dark_gray>"
punish-staff-kicked: "<dark_gray>[<red>Staff</red>]</dark_gray> <gold><issuer></gold> <gray>kicked</gray> <gold><player></gold><gray>:</gray> <white><reason></white> <dark_gray>#<id></dark_gray>"
punish-staff-revoked: "<dark_gray>[<red>Staff</red>]</dark_gray> <gold><issuer></gold> <gray>lifted the</gray> <type> <gray>of</gray> <gold><player></gold> <dark_gray>#<id></dark_gray>"
punish-history-header: "<gold>History of <player></gold> <gray>(page <page>/<pages>)</gray>"
punish-history-line: "<dark_gray>#<id></dark_gray> <gray><date></gray> <yellow><type></yellow> <gray>on <scope>, <duration></gray> <white><reason></white> <gray>by <issuer></gray> <status>"
punish-history-empty: "<green><player> has a clean record.</green>"
punish-status-active: "<red>active</red>"
punish-status-expired: "<dark_gray>expired</dark_gray>"
punish-status-revoked: "<green>lifted by <issuer></green>"
punish-status-done: ""
punish-check-header: "<gold><player></gold> <dark_gray><uuid></dark_gray>"
punish-check-seen: "<gray>First seen <white><first></white>, last seen <white><last></white> from <white><ip></white>.</gray>"
punish-check-active: "<gray>• <red><type></red> on <scope>, <remaining> left: <white><reason></white></gray> <dark_gray>#<id></dark_gray>"
punish-check-none: "<green>No active punishments.</green>"
punish-ip-hidden: "hidden"
punish-banned-from-server: "<red>You are banned from <gold><server></gold> for <white><remaining></white>: <white><reason></white> <dark_gray>#<id></dark_gray></red>"
punish-moved-to: "<gray>You were sent to <white><server></white> instead.</gray>"
punish-server-ban-screen: "<red><bold>You are banned from <server>, and no other server can take you.</bold></red><newline><newline><gray>Reason: <white><reason></white><newline>Expires in: <white><expires></white><newline>Ban ID: <white>#<id></white></gray><appeal>"
punish-muted-notice: "<red>You are muted for <white><remaining></white>: <white><reason></white> <dark_gray>#<id></dark_gray></red>"
punish-you-were-muted: "<red>You were muted on <scope> <gray>(<duration>)</gray>: <white><reason></white></red>"
punish-mute-ended: "<green>You can chat again.</green>"
punish-no-companion: "<gray>Note: <white><server></white> does not run the companion plugin, so chat is not blocked there.</gray>"
