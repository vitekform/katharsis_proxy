# Čeština (cs_CZ) pro Katharsis proxy.
#
# Formátování používá MiniMessage: https://docs.advntr.dev/minimessage/format.html
# Zástupné symboly se píší jako <server> a jsou uvedeny u každé zprávy.

prefix: "<dark_gray>[<gold>Katharsis</gold>]</dark_gray> "

players-only: "<red>Tento příkaz mohou použít pouze hráči.</red>"

# <server>
connecting: "<gray>Přesouvám tě na <gold><server></gold>...</gray>"
# <server>
already-connected: "<red>Už jsi na serveru <gold><server></gold>.</red>"
# <server>
unknown-server: "<red>Server <gold><server></gold> není na této proxy nastaven.</red>"
# <server>
connection-failed: "<red>Nepodařilo se tě připojit na <gold><server></gold>. Zkus to prosím později.</red>"

# <time>
on-cooldown: "<red>Počkej prosím <gold><time></gold>, než příkaz použiješ znovu.</red>"
# <minutes> <seconds>
duration-minutes-seconds: "<minutes> min <seconds> s"
# <seconds>
duration-seconds: "<seconds> s"

# <language>
language-changed: "<green>Tvůj jazyk je nyní <gold><language></gold>.</green>"

# Zobrazeno ve výběru jazyka v doplňkovém pluginu.
# Každý soubor pojmenovává sám sebe, takže každá položka je ve svém jazyce.
language-name: "Čeština"
menu-title: "<dark_gray>Vyber si jazyk"
menu-select-hint: "<gray>Klikni pro použití tohoto jazyka."
menu-current-hint: "<green>Tento jazyk právě používáš."

# Propojení účtů ve hře.
link-usage: "<red>Použití: <gold>/link KÓD</gold>. Kód získáš příkazem <gold>/link</gold> na našem Discord serveru.</red>"
# <discord>
link-success: "<green>Tvůj účet je nyní propojen s Discord účtem <gold><discord></gold>.</green>"
link-invalid-code: "<red>Tento kód je neplatný, vypršel nebo už byl použit. Nový získáš příkazem <gold>/link</gold> na Discordu.</red>"
# <discord>
link-already-linked: "<red>Tvůj účet už je propojen s Discord účtem <gold><discord></gold>.</red>"
link-discord-taken: "<red>Tento Discord účet už je propojen s jiným hráčem.</red>"
link-unavailable: "<red>Propojení účtů teď není dostupné. Zkus to prosím později.</red>"

# Propojení účtů na Discordu. Tyto zprávy jdou na Discord, takže používají jeho
# markdown (**tučně**, `kód`), ne barvy MiniMessage.
discord-link-description: "Propoj svůj Minecraft účet se svým Discord účtem"
# <code> <hours>
discord-link-code: "Tvůj kód pro propojení je **<code>**. Připoj se na Minecraft server a do <hours> hodin napiš `/link <code>`. Kód lze použít jen jednou."
# <player>
discord-link-already-linked: "Tvůj Discord účet už je propojen s hráčem **<player>**."
discord-link-unavailable: "Propojení účtů teď není dostupné. Zkus to prosím později."

# Ve hře, zpráva napsaná v chatovacím kanálu na Discordu.
# <player> je propojené Minecraft jméno autora, <message> to, co napsal.
discord-chat-message: "<dark_gray>[<blue>Discord</blue>]</dark_gray> <gray><player>:</gray> <white><message></white>"

# Nabídka /settings v doplňkovém pluginu.
settings-title: "<dark_gray>Nastavení"
settings-language: "<gold>Jazyk"
# <language> je název aktuálního jazyka v něm samotném.
settings-language-hint: "<gray>Právě <white><language></white>. Klikni pro změnu."
settings-discord-chat: "<blue>Chat z Discordu"
settings-discord-chat-on: "<green>Zobrazuje se ve hře.</green> <gray>Klikni pro skrytí."
settings-discord-chat-off: "<red>Skrytý.</red> <gray>Klikni pro zobrazení ve hře."

# Zeptáme se jednou, při prvním připojení, hned po výběru jazyka.
discord-chat-prompt-title: "<dark_gray>Zobrazovat chat z Discordu?"
discord-chat-prompt-yes: "<green>Ano, zobrazovat"
discord-chat-prompt-no: "<red>Ne, nechat skrytý"
discord-chat-shown: "<green>Zprávy z Discordu se ti teď zobrazují v chatu. Změnit to můžeš kdykoli příkazem <gold>/settings</gold>.</green>"
discord-chat-hidden: "<gray>Zprávy z Discordu jsou teď skryté. Změnit to můžeš kdykoli příkazem <gold>/settings</gold>.</gray>"

# Moderace chatu. Uvidí ji jen autor zadržené zprávy; ostatní ji prostě
# nikdy neuvidí.
chat-blocked: "<red>Tvoje zpráva nebyla odeslána: porušila pravidla chatu.</red>"
chat-unchecked: "<gray>Tvoji zprávu se teď nepodařilo zkontrolovat, a tak nebyla odeslána. Zkus to prosím znovu.</gray>"

# Přihlášení. Hráči bez účtu Mojang čekají v prázdné prázdnotě, dokud se
# nepřihlásí nebo nezaregistrují; nic jiného do té doby nefunguje. Důvody
# vyhození se zobrazují bez prefixu.
auth-title: "<gold>Přihlášení"
auth-subtitle-login: "<gray>/login HESLO"
auth-subtitle-register: "<gray>/register HESLO HESLO"
auth-prompt-login: "<gray>Vítej zpět! Přihlas se příkazem <gold>/login HESLO</gold>.</gray>"
auth-prompt-register: "<gray>Vítej! Zvol si heslo příkazem <gold>/register HESLO HESLO</gold>.</gray>"
auth-only-auth-commands: "<red>Dokud se nepřihlásíš, fungují jen <gold>/login</gold> a <gold>/register</gold>.</red>"
auth-login-usage: "<red>Použití: <gold>/login HESLO</gold></red>"
auth-register-usage: "<red>Použití: <gold>/register HESLO HESLO</gold></red>"
auth-not-registered: "<red>Toto jméno ještě nemá účet. Použij <gold>/register HESLO HESLO</gold>.</red>"
auth-already-registered: "<red>Toto jméno je už zaregistrované. Použij <gold>/login HESLO</gold>.</red>"
# <attempts>
auth-wrong-password: "<red>Špatné heslo. Zbývá pokusů: <gold><attempts></gold>.</red>"
# <min>
auth-password-too-short: "<red>Heslo musí mít alespoň <gold><min></gold> znaků.</red>"
# <max>
auth-password-too-long: "<red>Heslo může mít nejvýše <gold><max></gold> znaků.</red>"
auth-password-mismatch: "<red>Hesla se neshodují.</red>"
auth-password-is-username: "<red>Heslo nemůže být tvoje jméno.</red>"
auth-busy: "<gray>Ještě ověřuji tvůj předchozí pokus, počkej prosím.</gray>"
auth-logged-in: "<green>Přihlášeno. Vítej zpět!</green>"
auth-registered: "<green>Zaregistrováno a přihlášeno. Heslo si zapamatuj: nedá se obnovit.</green>"
auth-already-logged-in: "<red>Už jsi přihlášen.</red>"
auth-kick-attempts: "<red>Příliš mnoho špatných hesel.</red>"
auth-kick-timeout: "<red>Nepřihlásil ses včas.</red>"
# <name>
auth-kick-wrong-case: "<red>Tento účet je zaregistrovaný jako <gold><name></gold>. Připoj se přesně s tímto jménem.</red>"
auth-unavailable: "<red>Přihlášení teď není dostupné. Zkus to prosím později.</red>"
