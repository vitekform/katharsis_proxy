name: Katharsis
version: '${project.version}'
main: me.ganamaga.katharsis_paper.KatharsisPaper
api-version: '${paper.api.version}'
authors: [vitekform, ganamaga]
description: Backend companion for the Katharsis Velocity proxy plugin.

commands:
  language:
    description: Open the language selector.
    aliases: [lang]
    usage: /language
  settings:
    description: Open your settings.
    usage: /settings
  kcompanion:
    description: Show the companion's version, or check for and download an update.
    usage: /kcompanion [check|update]
    permission: katharsis.update

permissions:
  katharsis.update:
    description: Check for and download updates of the companion.
    default: op
  katharsis.update.notify:
    description: Be told about a companion update when joining.
    default: op
