# Build pipeline for the Katharsis Velocity proxy plugin.
#
#   Build stage    - compiles, runs the unit tests, shades the jar, then boots
#                    the shaded jar on a real Velocity proxy (VelocityServerIT).
#   Publish stage  - keeps the plugin jar as a build artifact, master only.

name: $(Date:yyyyMMdd)$(Rev:.r)

trigger:
  batch: true
  branches:
    include:
      - master

pr:
  branches:
    include:
      - master

variables:
  # Kept off the default ~/.m2 so the Cache task can restore it.
  MAVEN_CACHE_FOLDER: $(Pipeline.Workspace)/.m2/repository
  # Lives outside target/ so `mvn clean` cannot delete the cached download.
  VELOCITY_CACHE_FOLDER: $(Pipeline.Workspace)/.velocity
  MAVEN_OPTS: '-Dmaven.repo.local=$(MAVEN_CACHE_FOLDER) -Xmx1024m'
  # Shared by the compiler release flag and the agent's JDK.
  JDK_VERSION: '21'

stages:
  - stage: Build
    displayName: Build and test
    jobs:
      - job: Verify
        displayName: mvn verify
        pool:
          vmImage: ubuntu-latest
        # The integration test downloads Velocity and boots a JVM, so allow
        # noticeably more than a plain compile would need.
        timeoutInMinutes: 30
        steps:
          - checkout: self
            fetchDepth: 1
            displayName: Checkout

          - task: JavaToolInstaller@0
            displayName: Use JDK $(JDK_VERSION)
            inputs:
              versionSpec: $(JDK_VERSION)
              jdkArchitectureOption: x64
              jdkSourceOption: PreInstalled

          - task: Cache@2
            displayName: Restore Maven repository
            inputs:
              key: 'maven | "$(Agent.OS)" | pom.xml'
              restoreKeys: |
                maven | "$(Agent.OS)"
                maven
              path: $(MAVEN_CACHE_FOLDER)

          - task: Cache@2
            displayName: Restore Velocity download
            inputs:
              # Keyed on the pom so a version bump fetches the new jar. The test
              # verifies the SHA-256 either way, so a stale entry cannot be used.
              key: 'velocity | "$(Agent.OS)" | pom.xml'
              path: $(VELOCITY_CACHE_FOLDER)

          - script: |
              set -euo pipefail
              mvn -B -ntp \
                -Dvelocity.cache.dir=$(VELOCITY_CACHE_FOLDER) \
                clean verify
            displayName: Build, unit test, shade and boot on Velocity

          - task: PublishTestResults@2
            displayName: Publish unit test results
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: '**/surefire-reports/TEST-*.xml'
              testRunTitle: 'Unit tests (JDK $(JDK_VERSION))'
              failTaskOnFailedTests: true

          - task: PublishTestResults@2
            displayName: Publish integration test results
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: '**/failsafe-reports/TEST-*.xml'
              testRunTitle: 'Integration tests (real Velocity server)'
              failTaskOnFailedTests: true

          - task: PublishCodeCoverageResults@2
            displayName: Publish code coverage
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: '$(Build.SourcesDirectory)/target/site/jacoco/jacoco.xml'
              pathToSources: '$(Build.SourcesDirectory)/src/main/java'

          - task: CopyFiles@2
            displayName: Stage the plugin jar
            inputs:
              sourceFolder: '$(Build.SourcesDirectory)/target'
              # original-*.jar is the pre-shade jar and is not shipped.
              contents: |
                katharsis_proxy-*.jar
                !original-*.jar
              targetFolder: '$(Build.ArtifactStagingDirectory)'

          - publish: $(Build.ArtifactStagingDirectory)
            artifact: plugin
            displayName: Publish the plugin jar

  - stage: Publish
    displayName: Publish artifact
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
    jobs:
      - job: Artifact
        displayName: Retain the plugin jar
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: none

          - download: current
            artifact: plugin
            displayName: Download the plugin jar

          - task: PublishBuildArtifacts@1
            displayName: Retain as a build artifact
            inputs:
              pathToPublish: '$(Pipeline.Workspace)/plugin'
              artifactName: katharsis-proxy
