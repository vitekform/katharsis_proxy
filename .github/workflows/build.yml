# Build workflow for the Katharsis plugins.
#
#   Plan job       - decides whether this run publishes, and as which version.
#   Proxy job      - compiles the Velocity plugin, runs its unit tests, shades
#                    the jar, then boots it on a real Velocity proxy.
#   Companion job  - builds the Paper companion for the 1.21.x line on JDK 21,
#                    runs its unit tests, then recompiles it against every
#                    supported Paper API.
#   Companion26    - builds the same sources for the 26.x line, which needs
#                    JDK 25 because every 26.x API jar is a Java 25 artifact.
#   NeoForge job   - builds the NeoForge mod's three jars (1.21.1-1.21.10,
#                    1.21.11 and 26.x) and runs its unit tests.
#   NeoForge compat- recompiles the mod against the newest NeoForge of every
#                    Minecraft version in the supported range.
#
# Jars go to the release system (rsys.ganamaga.me, project katharsis), not to
# workflow artifacts:
#   push to master (or a manual run on it)
#                   prerelease <version>-dev.<run number> (e.g. 0.1-dev.42,
#                   <version> being pom.xml's)
#   v<version> tag  release <version> (e.g. v0.2 -> 0.2)
# `latest` is the newest tagged release; `latest?prerelease=true` is the
# newest build. Pull requests build and test but publish nothing.
#
# Every jar is stamped with that release name (-Dkatharsis.release for Maven,
# -Prelease for Gradle), which is how its update checker knows what it is; see
# updater/README.md. A jar without one, as on a pull request, counts as a local
# build and is never replaced automatically.
#
# Each build job uploads its own jars into a draft of that release; the Release
# job publishes it once every job, compatibility checks included, has passed, so
# nobody ever sees a release with only some of the jars.
#
# That needs the repository secret RSYS_TOKEN: a CLI token with rsys:read and
# rsys:publish, from an account with the release_system permission
#   gn-cli token create ci-katharsis -s rsys:read,rsys:publish --expires 1y
# and the project created once:
#   gn-cli rsys new-project katharsis --name Katharsis --public
# Without the secret the run warns and nothing is published. gn-cli itself is
# fetched from rsys by ci/install-gn-cli.sh.
#
# Old workflow artifacts can be wiped with the manual Delete artifacts workflow.
#
# The build jobs are independent: the plugins share a wire protocol, not code,
# and each side pins the other's exact bytes in its own tests.

name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

# A newer push to a pull request supersedes the run in progress. On master the
# running build finishes and only the newest waiting one is kept, which batches
# a burst of pushes into one build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  MAVEN_OPTS: -Xmx1024m
  # Lives outside target/ so `mvn clean` cannot delete the cached download.
  VELOCITY_CACHE_FOLDER: ${{ github.workspace }}/.velocity-cache
  # The proxy and the companion's 1.21.x variant build on JDK 21.
  JDK_VERSION: '21'
  # The companion's 26.x variant cannot: every 26.x Paper API jar is compiled to
  # Java 25 bytecode, which an older javac cannot read at all.
  COMPANION_26_JDK_VERSION: '25'
  RSYS_PROJECT: katharsis

jobs:
  plan:
    name: Plan the release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          sparse-checkout: pom.xml
          sparse-checkout-cone-mode: false

      - name: Pick the version
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          HAS_TOKEN: ${{ secrets.RSYS_TOKEN != '' }}
        run: |
          set -euo pipefail
          publish=false; version=""; prerelease=false
          if [ "$EVENT" != pull_request ]; then
            case "$REF" in
              refs/tags/v*)
                publish=true; version="${REF#refs/tags/v}" ;;
              refs/heads/master)
                # The project's own version is the first <version> in the pom:
                # it has no parent, and the plugins' versions come later.
                base="$(sed -n 's|^ *<version>\([^<]*\)</version>.*|\1|p' pom.xml | head -n 1)"
                [ -n "$base" ] || { echo "::error::no <version> in pom.xml"; exit 1; }
                publish=true; version="$base-dev.$GITHUB_RUN_NUMBER"; prerelease=true ;;
            esac
          fi
          if [ "$publish" = true ] && [ "$HAS_TOKEN" != true ]; then
            echo "::warning::RSYS_TOKEN is not set; not publishing Katharsis $version to rsys.ganamaga.me"
            publish=false
          fi
          echo "publish: $publish, version: ${version:-none}, prerelease: $prerelease"
          { echo "publish=$publish"; echo "version=$version"; echo "prerelease=$prerelease"; } >> "$GITHUB_OUTPUT"

  proxy:
    name: Velocity plugin
    needs: plan
    runs-on: ubuntu-latest
    # The integration test downloads Velocity and boots a JVM, so allow
    # noticeably more than a plain compile would need.
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use JDK ${{ env.JDK_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JDK_VERSION }}

      - name: Restore Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-proxy-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: |
            maven-proxy-${{ runner.os }}-
            maven-${{ runner.os }}-

      - name: Restore Velocity download
        uses: actions/cache@v4
        with:
          # Keyed on the pom so a version bump fetches the new jar. The test
          # verifies the SHA-256 either way, so a stale entry cannot be used.
          path: ${{ env.VELOCITY_CACHE_FOLDER }}
          key: velocity-${{ runner.os }}-${{ hashFiles('pom.xml') }}

      - name: Build, unit test, shade and boot on Velocity
        env:
          RELEASE: ${{ needs.plan.outputs.version }}
        run: |
          mvn -B -ntp \
            -Dvelocity.cache.dir="$VELOCITY_CACHE_FOLDER" \
            -Dkatharsis.release="$RELEASE" \
            clean verify

      - name: Publish test results
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v5
        with:
          check_name: Proxy tests (JDK ${{ env.JDK_VERSION }} and real Velocity server)
          report_paths: |
            target/surefire-reports/TEST-*.xml
            target/failsafe-reports/TEST-*.xml
          fail_on_failure: true
          # A fork's token cannot create a check run; annotate the run instead.
          annotate_only: ${{ github.event.pull_request.head.repo.fork == true }}

      - name: Publish code coverage
        if: ${{ !cancelled() }}
        run: ./ci/coverage-summary.sh 'Proxy coverage' target/site/jacoco/jacoco.csv

      - name: Fetch gn-cli
        if: needs.plan.outputs.publish == 'true'
        run: ./ci/install-gn-cli.sh

      - name: Upload the proxy jar to the release system
        if: needs.plan.outputs.publish == 'true'
        env:
          GN_TOKEN: ${{ secrets.RSYS_TOKEN }}
          RSYS_VERSION: ${{ needs.plan.outputs.version }}
          RSYS_PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          # original-*.jar is the pre-shade jar and is not shipped; this glob
          # does not match it. The proxy jar is what `latest` hands out.
          jar=(target/katharsis_proxy-*.jar)
          ./ci/rsys-upload.sh --primary "$(basename "${jar[0]}")" "${jar[@]}"

  companion:
    name: Paper companion (1.21.x)
    needs: plan
    runs-on: ubuntu-latest
    # The compatibility check resolves a dependency tree per supported Paper
    # version, which is slow the first time the Maven cache is cold.
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use JDK ${{ env.JDK_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JDK_VERSION }}

      - name: Restore Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-companion-${{ runner.os }}-${{ hashFiles('paper/pom.xml') }}
          restore-keys: |
            maven-companion-${{ runner.os }}-
            maven-${{ runner.os }}-

      - name: Build and unit test the companion
        env:
          RELEASE: ${{ needs.plan.outputs.version }}
        run: mvn -B -ntp -f paper/pom.xml -Dkatharsis.release="$RELEASE" clean verify

      - name: Compile against every supported Paper API
        run: ./paper/compat-check.sh

      - name: Publish companion test results
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v5
        with:
          check_name: Companion 1.21.x tests (JDK ${{ env.JDK_VERSION }})
          report_paths: paper/target/surefire-reports/TEST-*.xml
          fail_on_failure: true
          # A fork's token cannot create a check run; annotate the run instead.
          annotate_only: ${{ github.event.pull_request.head.repo.fork == true }}

      - name: Publish companion code coverage
        if: ${{ !cancelled() }}
        run: ./ci/coverage-summary.sh 'Companion 1.21.x coverage' paper/target/site/jacoco/jacoco.csv

      - name: Fetch gn-cli
        if: needs.plan.outputs.publish == 'true'
        run: ./ci/install-gn-cli.sh

      - name: Upload the companion jar to the release system
        if: needs.plan.outputs.publish == 'true'
        env:
          GN_TOKEN: ${{ secrets.RSYS_TOKEN }}
          RSYS_VERSION: ${{ needs.plan.outputs.version }}
          RSYS_PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          shopt -s extglob
          ./ci/rsys-upload.sh paper/target/katharsis_paper-!(*-mc26).jar

  companion26:
    name: Paper companion (26.x)
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use JDK ${{ env.COMPANION_26_JDK_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.COMPANION_26_JDK_VERSION }}

      - name: Restore Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-companion26-${{ runner.os }}-${{ hashFiles('paper/pom.xml') }}
          restore-keys: |
            maven-companion26-${{ runner.os }}-
            maven-companion-${{ runner.os }}-
            maven-${{ runner.os }}-

      - name: Build and unit test the 26.x variant
        env:
          RELEASE: ${{ needs.plan.outputs.version }}
        run: mvn -B -ntp -f paper/pom.xml -P paper-26 -Dkatharsis.release="$RELEASE" clean verify

      - name: Compile against every supported Paper API (full range)
        # This JDK can read both lines' APIs, so --strict here proves the whole
        # range was checked rather than just the half JDK 21 reaches.
        run: ./paper/compat-check.sh --strict

      - name: Publish 26.x test results
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v5
        with:
          check_name: Companion 26.x tests (JDK ${{ env.COMPANION_26_JDK_VERSION }})
          report_paths: paper/target/surefire-reports/TEST-*.xml
          fail_on_failure: true
          # A fork's token cannot create a check run; annotate the run instead.
          annotate_only: ${{ github.event.pull_request.head.repo.fork == true }}

      - name: Fetch gn-cli
        if: needs.plan.outputs.publish == 'true'
        run: ./ci/install-gn-cli.sh

      - name: Upload the 26.x companion jar to the release system
        if: needs.plan.outputs.publish == 'true'
        env:
          GN_TOKEN: ${{ secrets.RSYS_TOKEN }}
          RSYS_VERSION: ${{ needs.plan.outputs.version }}
          RSYS_PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: ./ci/rsys-upload.sh paper/target/katharsis_paper-*-mc26.jar

  neoforge:
    name: NeoForge mod
    needs: plan
    runs-on: ubuntu-latest
    # Each line has Minecraft decompiled and recompiled on a cold cache.
    timeout-minutes: 45
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # JDK 21 for the 1.21 lines, JDK 25 for the 26 line; Gradle runs on the
      # last one listed and finds the other as a toolchain.
      - name: Use JDK 21 and ${{ env.COMPANION_26_JDK_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            ${{ env.JDK_VERSION }}
            ${{ env.COMPANION_26_JDK_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build and unit test every line
        working-directory: neoforge
        env:
          RELEASE: ${{ needs.plan.outputs.version }}
        run: |
          ./gradlew --no-daemon build -Prelease="$RELEASE"
          ./gradlew --no-daemon build -Prelease="$RELEASE" -Pline=1.21.11
          ./gradlew --no-daemon build -Prelease="$RELEASE" -Pline=26

      - name: Publish NeoForge test results
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v5
        with:
          check_name: NeoForge mod tests
          report_paths: neoforge/build/test-results/test/TEST-*.xml
          fail_on_failure: true
          # A fork's token cannot create a check run; annotate the run instead.
          annotate_only: ${{ github.event.pull_request.head.repo.fork == true }}

      - name: Fetch gn-cli
        if: needs.plan.outputs.publish == 'true'
        run: ./ci/install-gn-cli.sh

      - name: Upload the NeoForge jars to the release system
        if: needs.plan.outputs.publish == 'true'
        env:
          GN_TOKEN: ${{ secrets.RSYS_TOKEN }}
          RSYS_VERSION: ${{ needs.plan.outputs.version }}
          RSYS_PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: ./ci/rsys-upload.sh neoforge/build/libs/katharsis_neoforge-*.jar

  neoforge-compat:
    name: NeoForge mod (every supported version)
    needs: plan
    runs-on: ubuntu-latest
    # Thirteen NeoForge versions, each decompiled and recompiled on a cold cache.
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use JDK 21 and ${{ env.COMPANION_26_JDK_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            ${{ env.JDK_VERSION }}
            ${{ env.COMPANION_26_JDK_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Compile against every supported NeoForge
        run: ./neoforge/compat-check.sh

  release:
    name: Publish ${{ startsWith(github.ref, 'refs/tags/') && 'release' || 'dev build' }}
    needs: [plan, proxy, companion, companion26, neoforge, neoforge-compat]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GN_TOKEN: ${{ secrets.RSYS_TOKEN }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          sparse-checkout: ci
          sparse-checkout-cone-mode: false

      - name: Fetch gn-cli
        run: ./ci/install-gn-cli.sh

      - name: Write the changelog
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          {
            echo "Built from \`${GITHUB_SHA:0:12}\` on $GITHUB_REF_NAME ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
            if [ -n "$COMMIT_MESSAGE" ]; then echo; echo "$COMMIT_MESSAGE"; fi
          } > notes.md

      - name: Publish the release
        run: |
          set -euo pipefail
          gn() { gn-cli --no-unicode --no-color "$@"; }
          gn rsys edit "$RSYS_PROJECT" "$VERSION" --changelog-file notes.md
          if [ "$(gn rsys show "$RSYS_PROJECT" "$VERSION" --json | jq -r .status)" = PUBLISHED ]; then
            echo "$RSYS_PROJECT $VERSION is already published"
          else
            gn rsys publish "$RSYS_PROJECT" "$VERSION"
          fi
          echo "### Published Katharsis $VERSION to https://rsys.ganamaga.me/$RSYS_PROJECT" >> "$GITHUB_STEP_SUMMARY"
