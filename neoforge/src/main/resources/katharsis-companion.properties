# Katharsis companion settings: what the Paper companion plugin keeps in its
# config.yml. Almost nothing lives here on purpose: the player's language, the
# menus' titles, the language names and every confirmation are translated by
# the proxy plugin, in its lang/ directory. Edit them there and every server
# picks the change up at once.

# Identifies this server in chat reports. The proxy posts this server's chat to
# the Discord channel mapped to this id under discord.chat-channels in its own
# config.yml, and messages written in that channel are shown to the players on
# this server. Servers sharing an id share a channel. Leave it empty to use this
# server's name from velocity.toml.
server-id=

# How long to wait for the proxy to answer before telling the player it is
# unreachable, in seconds.
request-timeout-seconds=5

# Only with GNLib installed: the fingerprint of the proxy's GNLib network key,
# which /kidentity on the proxy prints (GN1:XXXX-XXXX-...). GNLib players pin
# the network, not each server, so they keep one identity across every server
# behind the proxy; this server gets a certificate for its own key from the
# proxy and checks it against this fingerprint. Left empty, this server offers
# GNLib players no remote content, and its log names the fingerprint the proxy
# presented for you to check and paste here. Updated by the mod itself when the
# proxy rotates its key.
network-fingerprint=

# The only strings this mod owns, because they are what it says when the proxy
# did not answer and there is no language to say it in. Colours and
# decorations use MiniMessage tags: https://docs.advntr.dev/minimessage/format.html
proxy-unreachable=<red>Could not reach the proxy. Please try again in a moment.
players-only=<red>Only players can use this command.
